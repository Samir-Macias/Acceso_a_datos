<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulario Responsive</title>
</head>

<body>

    <header>
        <h1>Formulario Responsive</h1>
    </header>

    <article>
        <form action="http://www.cursos-diseño.es/mostrar.php" method="post">
            Nombre
            <input type="text" name="Nombre">
            <div class="fila">
                <div class="columna1">
                    Email
                    <input type="email" name="email">
                </div>
                <div class="columna2">
                    Teléfono
                    <input type="text" name="telefono">
                </div>
            </div>


            <div class="fila">
                <div class="columna1"><select name="" id="">
                    <option value="i1">Individual</option>
                    <option value="d2" selected>Doble 2 camas</option>
                    <option value="d1">Doble matrimonio</option>
                    <option value="t3">Triple 3 camas</option>
                    <option value="t2">Triple matrimonio + individual</option>
                </select></div>
                <div class="columna2">  
                   <input type="checkbox" name="desayuno" value="si">
                    Desayuno incluido
                </div>
            </div>

            Tipo de Habitación
            
            Comentario
            <textarea name="comentario" rows="5"></textarea>
            <div id="boton"><input type="submit"></div>
        </form>
    </article>

</body>

</html>

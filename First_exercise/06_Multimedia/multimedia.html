<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Multimedia</title>
  </head>
  <body>
    <h1>Multimedia</h1>
    <p>
      En esta sección se pueden agregar elementos multimedia como imágenes,
      videos y audio.
    </p>

    <h2>Imagen</h2>
    <h3>Fiesta </h3>
    <div>
      <img
        src="../pruebas/caratula.jpg"
        alt="Descripción de la imagen"
        width="300"
      />

      <img src="../pruebas/escudo.jpg"  id="avatar" alt="">
    </div>

    <h2>Video</h2>
    <div>
      <video width="320" height="240" controls>
        <source src="../pruebas/pelicula.mp4" type="video/mp4" />
      </video>
    </div>

    <h2>Audio</h2>
    <div>
      <audio controls>
        <source src="../pruebas/sonido.mp3" type="audio/mpeg" />
      </audio>
    </div>

    <h2>Iframe - Documento PDF</h2>
    <div>
      <iframe src="../pruebas/ficha.pdf" width="30%" height="400" frameborder="0"></iframe>
    </div>
    
    <h2>Iframe - Mapa</h2>
    <div>
      <iframe
        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3036.5698748269083!2d-3.6296978881401003!3d40.44052227131659!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd422f840a8a994f%3A0x30bf36feeec08534!2sUDIT%20Universidad%20-%20Campus%20Internacional%20de%20Tecnolog%C3%ADa%2C%20Innovaci%C3%B3n%20y%20Ciencias%20Aplicadas!5e0!3m2!1ses!2ses!4v1791390297344!5m2!1ses!2ses"
        width="400"
        height="350"
        style="border: 0"
        allowfullscreen=""
        loading="lazy"
        referrerpolicy="strict-origin-when-cross-origin">
      </iframe>
    </div>
  </body>
</html>
